<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f4f1" />
  <title>NEXORA | Project Management, Simplified.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">NX</div><div><strong>NEXORA</strong><span class="brand-tagline">Project Management, Simplified.</span></div></div>
      <div class="workspace-switch"><div class="workspace-avatar">AC</div><div><b>Acme Collective</b><span>Workspace</span></div><i>⌄</i></div>
      <nav class="nav-group"><span class="nav-label">Workspace</span>
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">◒</span>Overview</button>
        <button class="nav-item" data-view="projects"><span class="nav-icon">▦</span>Projects <em id="project-badge">6</em></button>
        <button class="nav-item" data-view="tasks"><span class="nav-icon">☷</span>Tasks <em id="task-badge">12</em></button>
        <button class="nav-item" data-view="timeline"><span class="nav-icon">◷</span>Timeline</button>
        <button class="nav-item" data-view="calendar"><span class="nav-icon">▣</span>Calendar</button>
      </nav>
      <nav class="nav-group"><span class="nav-label">People &amp; data</span>
        <button class="nav-item" data-view="clients"><span class="nav-icon">♧</span>Clients</button>
        <button class="nav-item" data-view="team"><span class="nav-icon">◎</span>Team</button>
        <button class="nav-item" data-view="reports"><span class="nav-icon">▥</span>Reports</button>
      </nav>
      <nav class="nav-group"><span class="nav-label">Operations</span>
        <button class="nav-item" data-view="risks"><span class="nav-icon">△</span>Risks &amp; issues <em class="alert-badge">4</em></button>
        <button class="nav-item" data-view="meetings"><span class="nav-icon">▣</span>Meetings</button>
        <button class="nav-item" data-view="documents"><span class="nav-icon">▤</span>Documents</button>
      </nav>
      <div class="sidebar-bottom"><button class="nav-item" data-view="assistant"><span class="nav-icon">✦</span>PM Assistant <em class="ai-badge">AI</em></button><button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span>Settings</button><div class="user-card"><div class="avatar dark">JD</div><div><b>Jordan Davis</b><span>Project Manager</span></div><i>•••</i></div></div>
    </aside>
    <main class="main-content">
      <header class="topbar"><button class="mobile-menu" id="mobile-menu">☰</button><div class="breadcrumbs"><span id="crumb-section">Overview</span><b>/</b><strong id="crumb-page">Dashboard</strong></div><div class="top-actions"><div class="global-search"><span>⌕</span><input id="global-search-input" placeholder="Search anything..." aria-label="Search anything"/><kbd>⌘ K</kbd></div><button class="icon-button notification" id="notify-btn">♢<span></span></button><div class="top-avatar">JD</div></div></header>
      <div id="app"></div>
    </main>
  </div>
  <div class="modal-backdrop" id="modal-backdrop"><div class="modal" id="modal"></div></div>
  <div class="toast" id="toast"></div>
  <script src="app.js?v=3"></script>
</body>
</html>
